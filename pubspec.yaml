name: ai_music_hub
description: "AI Chat with Gemini 2.5 Flash fallback & MP3 Music Downloader"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  audioplayers: ^6.1.0
  flutter_markdown: ^0.7.4+3
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  speech_to_text: ^7.4.0
  image_picker: ^1.1.2
  porcupine_flutter: ^4.0.0
  flutter_foreground_task: ^10.0.0
  flutter_tts: ^4.2.2
  torch_light: ^1.1.0
  battery_plus: ^6.2.1
  url_launcher: ^6.3.1
  volume_controller: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
