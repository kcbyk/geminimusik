<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI Chat & MP3 Music Downloader">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI Music Hub">

  <title>AI Music Hub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #000000; margin: 0; padding: 0;">
  <script>
    window.updateMediaSession = function(title, artist, artworkUrl, isPlaying) {
      if ('mediaSession' in navigator) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: title || 'Şarkı',
            artist: artist || 'AI Music Hub',
            album: 'AI Music Hub',
            artwork: artworkUrl ? [
              { src: artworkUrl, sizes: '96x96', type: 'image/jpeg' },
              { src: artworkUrl, sizes: '192x192', type: 'image/jpeg' },
              { src: artworkUrl, sizes: '512x512', type: 'image/jpeg' }
            ] : []
          });
          navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
          
          navigator.mediaSession.setActionHandler('play', function() {
            if (window._flutterOnPlay) window._flutterOnPlay();
          });
          navigator.mediaSession.setActionHandler('pause', function() {
            if (window._flutterOnPause) window._flutterOnPause();
          });
          navigator.mediaSession.setActionHandler('stop', function() {
            if (window._flutterOnStop) window._flutterOnStop();
          });
        } catch (e) {
          console.warn('MediaSession error:', e);
        }
      }
    };
    window.clearMediaSession = function() {
      if ('mediaSession' in navigator) {
        try {
          navigator.mediaSession.playbackState = 'none';
          navigator.mediaSession.metadata = null;
        } catch (e) {}
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
