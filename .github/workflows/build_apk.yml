name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=GEMINI_API_KEYS="${{ secrets.GEMINI_API_KEYS }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiMusik-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Gemini Müzik & Asistan v1.0.0 (APK)
          body: |
            ## 🎵 Gemini Müzik & AI Sesli Asistan (v1.0.0)

            Uygulama başarıyla derlendi! Aşağıdaki bağlantıdan APK dosyasını doğrudan telefonunuza indirip kurabilirsiniz.

            ### ✨ Öne Çıkan Özellikler:
            - **Müzik Hub:** YouTube üzerinden 320kbps MP3 indirme & kesintisiz arka planda çalma.
            - **Arka Planda Sesli Asistan:** Telefon kilitliyken bile sesli komutla şarkı açma (Jarvis / Google tarzı).
            - **Google Gemini 2.5 Flash:** Akıllı chat, çoklu API anahtarı havuzu ve web arama entegrasyonu.
            - **TikTok Tarzı Kaydırmalı Oynatıcı:** Canlı arama ve scrubber çubuğu.
          files: build/app/outputs/flutter-apk/app-release.apk
